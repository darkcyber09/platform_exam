services:
    app:
        build:
            context: .
            dockerfile: Dockerfile
        container_name: clint-practice-container
        ports:
            - "8000:80"
        volumes:
            - ./src:/app/src
            - ./templates:/app/templates
            - ./public:/app/public
            - clint-var:/app/var
            - ./migrations:/app/migrations # <--- ADD THIS LINE
        environment:
            DATABASE_URL: "mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}?serverVersion=8.0.32&charset=utf8mb4"
            APP_ENV: prod # change to prod
            APP_DEBUG: "0" # change to "0" in prod
        depends_on:
            db:
                condition: service_healthy
        networks:
            - clint-network
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost/"]
            interval: 10s
            timeout: 5s
            retries: 3
            start_period: 10s

    db:
        image: mysql:8.0
        container_name: pract-db
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: ${MYSQL_DATABASE}
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        ports:
            - "3310:3306"
        volumes:
            - clint-db:/var/lib/mysql
        networks:
            - clint-network
        healthcheck:
            test:
                [
                    "CMD-SHELL",
                    "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1",
                ]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

volumes:
    clint-db:
    clint-var:

networks:
    clint-network:
        driver: bridge
